<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rémy STINUS - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="cyberRain"></canvas>
    <div class="scanline"></div>
    
    <div class="container">
        <header>
            <div class="terminal-header">
                <div class="header-left">
                    <span class="terminal-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="4 17 10 11 4 5"></polyline>
                            <line x1="12" y1="19" x2="20" y2="19"></line>
                        </svg>
                    </span>
                    <span class="title">remy@server:~/dashboard</span>
                </div>
                <div class="header-controls">
                    <button class="control-btn mini">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                    <button class="control-btn max">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        </svg>
                    </button>
                    <button class="control-btn close">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <script src="script.js"></script>  
        </header>

        <main class="grid">
            <a href="https://portfolio.remystinus.fr" class="card">
                <div class="card-icon">🚀</div>
                <div class="card-content">
                    <h3>01. Portfolio</h3>
                    <p>Nuxt.js / Dev</p>
                    <span class="status online">ONLINE</span>
                </div>
            </a>

            <a class="card">
                <div class="card-icon">🔐</div>
                <div class="card-content">
                    <h3>02. SSH connexion</h3>
                    <p>React / connection</p>
                    <span class="status secured">SECURED</span>
                </div>
            </a>

            <a href="https://github.com/rstinus" target="_blank" class="card">
                <div class="card-icon">📁</div>
                <div class="card-content">
                    <h3>03. Repositories</h3>
                    <p>Open Source Projects</p>
                    <span class="status online">ONLINE</span>
                </div>
            </a>
        </main>

        <footer>
            <p class="blink">_ Accessing secure gateway... Ready.</p>
        </footer>
    </div>
</body>
</html>
